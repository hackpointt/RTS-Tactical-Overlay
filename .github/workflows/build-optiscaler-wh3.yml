name: Build OptiScaler WH3 DLSS5 compat

on:
  push:
    branches:
      - optiscaler-wh3-dlss5-test
    paths:
      - '.github/workflows/build-optiscaler-wh3.yml'
      - 'optiscaler-wh3-build/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout helper repo
        uses: actions/checkout@v4

      - name: Clone OptiScaler at tested commit
        shell: powershell
        run: |
          git clone --recursive https://github.com/optiscaler/OptiScaler.git optiscaler-src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location optiscaler-src
          git checkout 5c5e424dd137d69ef36c4231fd45b760b4c65cc8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply and verify WH3/DLSS5 patch
        shell: powershell
        run: |
          Set-Location optiscaler-src
          git apply --recount "${{ github.workspace }}\optiscaler-wh3-build\patches\wh3-dlss5-d3d12-passthrough.patch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $patched = Select-String -Path "OptiScaler\inputs\NVNGX_DLSS_Dx12.cpp" -Pattern "WH3/DLSS5 compat v2" -SimpleMatch
          if (-not $patched) {
            Write-Error "WH3 compatibility marker missing after patch application"
            exit 1
          }

          git diff -- OptiScaler/inputs/NVNGX_DLSS_Dx12.cpp

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        shell: powershell
        run: |
          Set-Location optiscaler-src
          msbuild /m /p:Configuration=Release . /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify compiled DLL contains patch marker
        shell: powershell
        run: |
          $dll = "optiscaler-src\x64\Release\a\OptiScaler.dll"
          if (-not (Test-Path $dll)) {
            Write-Error "Compiled OptiScaler.dll not found at expected staged path"
            exit 1
          }
          $bytes = [System.IO.File]::ReadAllBytes($dll)
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          if (-not $ascii.Contains("WH3/DLSS5 compat v2")) {
            Write-Error "Compiled DLL does not contain WH3 compatibility marker"
            exit 1
          }
          Write-Host "Verified WH3 compatibility marker in compiled DLL."

      - name: Stage artifact
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item -Recurse -Force "optiscaler-src\x64\Release\a\*" package\
          Copy-Item "optiscaler-wh3-build\patches\wh3-dlss5-d3d12-passthrough.patch" package\
          @"
          OptiScaler WH3 + DLSS5 compatibility test build v3
          Base commit: 5c5e424dd137d69ef36c4231fd45b760b4c65cc8

          IMPORTANT: This build verifies the patch marker exists in the compiled DLL.

          Patch behavior:
          - Keeps D3D11 DLSS interception enabled for Warhammer3.exe.
          - Passes D3D12 DLSS SuperSampling/RayReconstruction through to native NGX in Warhammer3.exe.
          - Intended to avoid intercepting ShortFuse dlss5-feed's auxiliary D3D12 DLSS feature.

          Test configuration:
          [Inputs]
          EnableDlssInputs=true

          FG Input: OptiFG (Upscaler)
          FG Output: XeFG

          This is an unsigned experimental build. Keep your original RHI-installed OptiScaler backup.
          "@ | Set-Content -Encoding UTF8 package\README-WH3-DLSS5.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OptiScaler-WH3-DLSS5-compat-v3-5c5e424d
          path: package
          if-no-files-found: error
