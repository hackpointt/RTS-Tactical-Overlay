name: Build OptiScaler WH3 DLSS5 compat v15 fixed

on:
  push:
    branches:
      - optiscaler-wh3-dlss5-test
    paths:
      - '.github/workflows/build-optiscaler-wh3-v15-fixed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout helper repo
        uses: actions/checkout@v4

      - name: Extract tested transforms directly
        shell: powershell
        run: |
          python -m pip install pyyaml --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          @'
          import os, pathlib, yaml

          ws = os.environ['GITHUB_WORKSPACE']
          token = '$' + '{{ github.workspace }}'

          specs = [
              ('.github/workflows/build-optiscaler-wh3-v12.yml', [
                  'Clone OptiScaler at tested commit',
                  'Apply WH3 DLSS5 native D3D12 passthrough',
                  'Apply XeFG v4-v7 WH3 compatibility fixes',
                  'Apply v12 dormant native DLSS OptiFG bridge',
              ]),
              ('.github/workflows/build-optiscaler-wh3-v13.yml', [
                  'Apply v13 private-shadow fix',
              ]),
              ('.github/workflows/build-optiscaler-wh3-v14.yml', [
                  'Apply v14 live status instrumentation',
              ]),
              ('.github/workflows/build-optiscaler-wh3-v15.yml', [
                  'Converge WH3 compatibility source',
                  'Export consolidated patch',
              ]),
          ]

          out = pathlib.Path('.v15-fixed-pre')
          out.mkdir(exist_ok=True)
          index = 0
          for workflow, names in specs:
              data = yaml.safe_load(pathlib.Path(workflow).read_text(encoding='utf-8'))
              steps = {s.get('name'): s for s in data['jobs']['build']['steps'] if isinstance(s, dict)}
              for name in names:
                  script = steps[name]['run'].replace(token, ws)
                  (out / f'{index:02d}.ps1').write_text(script, encoding='utf-8')
                  index += 1

          data = yaml.safe_load(pathlib.Path('.github/workflows/build-optiscaler-wh3-v15.yml').read_text(encoding='utf-8'))
          steps = {s.get('name'): s for s in data['jobs']['build']['steps'] if isinstance(s, dict)}
          post = pathlib.Path('.v15-fixed-post')
          post.mkdir(exist_ok=True)
          for i, name in enumerate(['Build Release x64', 'Verify converged DLL', 'Stage artifact']):
              script = steps[name]['run'].replace(token, ws)
              (post / f'{i:02d}.ps1').write_text(script, encoding='utf-8')
          '@ | Set-Content -Encoding UTF8 .v15_fixed_extract.py

          python .v15_fixed_extract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Get-ChildItem .v15-fixed-pre\*.ps1 | Sort-Object Name | ForEach-Object {
            Write-Host "Running pre-build transform: $($_.Name)"
            & powershell -NoProfile -ExecutionPolicy Bypass -File $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build verify and stage
        shell: powershell
        run: |
          Get-ChildItem .v15-fixed-post\*.ps1 | Sort-Object Name | ForEach-Object {
            Write-Host "Running post-build step: $($_.Name)"
            & powershell -NoProfile -ExecutionPolicy Bypass -File $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OptiScaler-WH3-DLSS5-compat-v15-5c5e424d
          path: package
          if-no-files-found: error