name: Build OptiScaler WH3 DLSS5 compat v13

on:
  push:
    branches:
      - optiscaler-wh3-dlss5-test
    paths:
      - '.github/workflows/build-optiscaler-wh3-v13.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout helper repo
        uses: actions/checkout@v4

      - name: Reuse tested v12 source transforms
        shell: powershell
        run: |
          python -m pip install pyyaml --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          @'
          import os, pathlib, yaml
          wf = pathlib.Path('.github/workflows/build-optiscaler-wh3-v12.yml')
          data = yaml.safe_load(wf.read_text(encoding='utf-8'))
          wanted = [
              'Clone OptiScaler at tested commit',
              'Apply WH3 DLSS5 native D3D12 passthrough',
              'Apply XeFG v4-v7 WH3 compatibility fixes',
              'Apply v12 dormant native DLSS OptiFG bridge',
          ]
          steps = {s.get('name'): s for s in data['jobs']['build']['steps'] if isinstance(s, dict)}
          ws = os.environ['GITHUB_WORKSPACE']
          out = pathlib.Path('.v13-reuse')
          out.mkdir(exist_ok=True)
          for i, name in enumerate(wanted):
              script = steps[name]['run'].replace('${{ github.workspace }}', ws)
              (out / f'{i:02d}.ps1').write_text(script, encoding='utf-8')
          '@ | Set-Content -Encoding UTF8 .v13_extract.py

          python .v13_extract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Get-ChildItem .v13-reuse\*.ps1 | Sort-Object Name | ForEach-Object {
            Write-Host "Running reused transform: $($_.Name)"
            & powershell -NoProfile -ExecutionPolicy Bypass -File $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Apply v13 private-shadow fix
        shell: powershell
        run: |
          $path = "optiscaler-src\OptiScaler\inputs\NVNGX_DLSS_Dx12.cpp"
          $text = [System.IO.File]::ReadAllText($path)

          $old = @'
                                  State::Instance().currentFeature = bridgeFeature;
                                  wh3BridgeRunning = true;

                                  UpscalerInputsDx12::UpscaleStart(InCmdList, InParameters, bridgeFeature);
          '@
          $new = @'
                                  // V13: keep the metadata-only shadow object private. Publishing it through
                                  // State::currentFeature makes LocalPresent treat it like a real initialized
                                  // upscaler and enter GPU-timing/frozen-check paths the shadow does not own.
                                  // UpscalerInputsDx12 already receives the feature explicitly, and XeFG can
                                  // activate from low-res MV metadata without currentFeature.
                                  wh3BridgeRunning = true;
                                  static bool wh3V13Logged = false;
                                  if (!wh3V13Logged)
                                  {
                                      LOG_INFO("WH3/DLSS5 compat v13: shadow kept private; currentFeature untouched while FG bridge runs");
                                      wh3V13Logged = true;
                                  }

                                  UpscalerInputsDx12::UpscaleStart(InCmdList, InParameters, bridgeFeature);
          '@

          if (-not $text.Contains($old)) { Write-Error "v13 private-shadow target not found"; exit 1 }
          $text = $text.Replace($old, $new)

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($path, $text, $utf8NoBom)

          if (-not (Select-String -Path $path -Pattern "WH3/DLSS5 compat v13: shadow kept private" -SimpleMatch)) {
            Write-Error "v13 marker missing"; exit 1
          }

          Set-Location optiscaler-src
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        shell: powershell
        run: |
          Set-Location optiscaler-src
          msbuild /m /p:Configuration=Release . /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify compiled DLL contains v2-v13 markers
        shell: powershell
        run: |
          $dll = "optiscaler-src\x64\Release\a\OptiScaler.dll"
          if (-not (Test-Path $dll)) { Write-Error "Compiled DLL missing"; exit 1 }
          $ascii = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($dll))
          foreach ($marker in @("WH3/DLSS5 compat v2", "WH3/XeFG compat v4", "WH3/XeFG compat v6", "WH3/XeFG compat v7", "WH3/DLSS5 compat v12 shadow feature init", "WH3/DLSS5 compat v12 bridge dormant", "WH3/DLSS5 compat v12 bridge tick", "WH3/DLSS5 compat v13: shadow kept private")) {
            if (-not $ascii.Contains($marker)) { Write-Error "Missing marker: $marker"; exit 1 }
          }

      - name: Stage artifact
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item -Recurse -Force "optiscaler-src\x64\Release\a\*" package\
          @"
          OptiScaler WH3 + DLSS5 compatibility test build v13
          Base commit: 5c5e424dd137d69ef36c4231fd45b760b4c65cc8

          Keeps all v12 behavior and adds one isolation fix:
          - the native-DLSS metadata shadow is NEVER assigned to State::currentFeature
          - UpscalerInputsDx12 still receives the shadow explicitly when FG is enabled
          - this avoids LocalPresent treating the metadata-only shadow as a real upscaler for GPU timing/frozen checks
          - native NVIDIA DLSS EvaluateFeature remains passthrough

          Keep RTSS and NVIDIA Smooth Motion off. Test 2560x1440 windowed first.
          "@ | Set-Content -Encoding UTF8 package\README-WH3-DLSS5.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OptiScaler-WH3-DLSS5-compat-v13-5c5e424d
          path: package
          if-no-files-found: error