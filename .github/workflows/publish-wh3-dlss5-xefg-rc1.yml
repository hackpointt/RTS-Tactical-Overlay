name: Publish WH3 Native DLSS5 to XeFG RC1

on:
  push:
    branches:
      - optiscaler-wh3-dlss5-test
    paths:
      - '.github/workflows/publish-wh3-dlss5-xefg-rc1.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          ref: optiscaler-wh3-dlss5-test

      - name: Download validated V15 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p v15-artifact
          gh run download 34704880248 \
            --repo "$GITHUB_REPOSITORY" \
            --name OptiScaler-WH3-DLSS5-compat-v15-5c5e424d \
            --dir v15-artifact
          test -f v15-artifact/OptiScaler.dll
          test -f v15-artifact/OptiScaler.ini
          test -f v15-artifact/WH3-native-DLSS5-XeFG.patch

      - name: Build curated RC1 package
        run: |
          python release/wh3-dlss5-xefg-rc1/build_release.py \
            --artifact-dir v15-artifact \
            --dist-dir dist
          test -f dist/WH3-Native-DLSS5-XeFG-RC1-v15.zip
          test -f dist/WH3-Native-DLSS5-XeFG-RC1-v15.zip.sha256
          test -f dist/WH3-native-DLSS5-XeFG.patch
          cat dist/WH3-Native-DLSS5-XeFG-RC1-v15.zip.sha256

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.0-rc1"
          TARGET="48a7f8b56ac84bf3d66fadfe02f9c5d8db7b6a0b"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET" \
            --title "WH3 Native DLSS5 → XeFG RC1 (V15)" \
            --notes-file dist/GITHUB_RELEASE_NOTES.md \
            --prerelease \
            dist/WH3-Native-DLSS5-XeFG-RC1-v15.zip \
            dist/WH3-Native-DLSS5-XeFG-RC1-v15.zip.sha256 \
            dist/WH3-native-DLSS5-XeFG.patch

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
